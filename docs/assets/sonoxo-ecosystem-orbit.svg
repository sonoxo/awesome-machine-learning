<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">MACHINE LEARNING // ATLAS visual guide</title><desc id="d">Navigate libraries and tools by language. Flow: QUESTION to LANGUAGE to CATEGORY to PROJECT to VERIFY.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020611"/><stop offset=".5" stop-color="#09142c"/><stop offset="1" stop-color="#170529"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#09223b"/><stop offset="1" stop-color="#1c0d35"/></linearGradient><linearGradient id="beam"><stop stop-color="#38efff"/><stop offset=".5" stop-color="#8b5cff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient><radialGradient id="core"><stop stop-color="#fff"/><stop offset=".12" stop-color="#67efff"/><stop offset=".5" stop-color="#853cff"/><stop offset="1" stop-color="#081027" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#54e7ff" stroke-opacity=".08"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="7" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.r1{transform-origin:600px 264px;animation:s 11s linear infinite}.r2{transform-origin:600px 264px;animation:s 7s linear reverse infinite}.beam{stroke-dasharray:14 11;animation:f 2s linear infinite}.core{animation:p 2.6s ease-in-out infinite}.node{animation:n 4s ease-in-out infinite}.n1,.n3{animation-delay:-1s}.n2{animation-delay:-2s}@keyframes s{to{transform:rotate(360deg)}}@keyframes f{to{stroke-dashoffset:-50}}@keyframes p{50%{opacity:.72;transform:scale(.94)}}@keyframes n{50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="560" rx="30" fill="url(#bg)"/><rect width="1200" height="560" rx="30" fill="url(#grid)"/><text x="600" y="78" fill="#f5f8ff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="4">MACHINE LEARNING // ATLAS</text><text x="600" y="112" fill="#87efff" font-family="Inter,Arial,sans-serif" font-size="17" text-anchor="middle" letter-spacing="2">Navigate libraries and tools by language</text><circle class="r1" cx="600" cy="264" r="108" fill="none" stroke="#5ff1ff" stroke-width="2" stroke-dasharray="4 16"/><circle class="r2" cx="600" cy="264" r="82" fill="none" stroke="#bb52ff" stroke-width="3" stroke-dasharray="36 10"/><circle class="core" cx="600" cy="264" r="66" fill="url(#core)" filter="url(#glow)"/><circle cx="600" cy="264" r="21" fill="#fff"/><text x="600" y="270" fill="#130a2b" font-family="monospace" font-size="14" font-weight="900" text-anchor="middle">CORE</text><path class="beam b0" d="M191 386 C250 310 200 310 259 386" fill="none" stroke="url(#beam)" stroke-width="3" stroke-linecap="round"/><path class="beam b1" d="M431 386 C490 310 455 310 514 356" fill="none" stroke="url(#beam)" stroke-width="3" stroke-linecap="round"/><path class="beam b2" d="M686 356 C745 310 710 310 769 386" fill="none" stroke="url(#beam)" stroke-width="3" stroke-linecap="round"/><path class="beam b3" d="M941 386 C1000 310 950 310 1009 386" fill="none" stroke="url(#beam)" stroke-width="3" stroke-linecap="round"/><g class="node n0"><rect x="19" y="350" width="172" height="72" rx="18" fill="url(#card)" stroke="#8b5cff" stroke-width="1"/><circle cx="48" cy="386" r="7" fill="#5ff4ff" filter="url(#glow)"/><text x="114" y="391" fill="#f4f8ff" font-family="ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="middle">QUESTION</text></g><g class="node n1"><rect x="259" y="350" width="172" height="72" rx="18" fill="url(#card)" stroke="#8b5cff" stroke-width="1"/><circle cx="288" cy="386" r="7" fill="#5ff4ff" filter="url(#glow)"/><text x="354" y="391" fill="#f4f8ff" font-family="ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="middle">LANGUAGE</text></g><g class="node n2"><rect x="514" y="320" width="172" height="72" rx="18" fill="url(#card)" stroke="#66efff" stroke-width="2"/><circle cx="543" cy="356" r="7" fill="#fff" filter="url(#glow)"/><text x="609" y="361" fill="#f4f8ff" font-family="ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="middle">CATEGORY</text></g><g class="node n3"><rect x="769" y="350" width="172" height="72" rx="18" fill="url(#card)" stroke="#8b5cff" stroke-width="1"/><circle cx="798" cy="386" r="7" fill="#5ff4ff" filter="url(#glow)"/><text x="864" y="391" fill="#f4f8ff" font-family="ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="middle">PROJECT</text></g><g class="node n4"><rect x="1009" y="350" width="172" height="72" rx="18" fill="url(#card)" stroke="#8b5cff" stroke-width="1"/><circle cx="1038" cy="386" r="7" fill="#5ff4ff" filter="url(#glow)"/><text x="1104" y="391" fill="#f4f8ff" font-family="ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="middle">VERIFY</text></g><text x="600" y="512" fill="#7589ad" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="3">SONOXO ECOSYSTEM VIEW • SOURCE-AWARE • HUMAN-VERIFIED</text></svg>